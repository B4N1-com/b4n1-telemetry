[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b4n1-telemetry"
version = "0.1.1"
description = "Drop-in error reporting to a b4n1-telemetry collector: logging + uncaught exceptions, stdlib only."
requires-python = ">=3.8"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []

[tool.setuptools]
packages = ["b4n1_telemetry"]
# The artefact must carry both texts, not just declare them in metadata:
# a wheel without the EULA is not distributable (§10k).
license-files = ["LICENSE", "EULA.txt"]
